[project]
name = "student-rag-playground-integration-tests"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "minio>=7.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
